<style>

body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:980px;margin:0 auto;display:grid;gap:22px}
header{display:grid;gap:8px}

.body{display:grid;gap:12px;padding:0 16px 16px}

async function desxifra(code,b64){
 const raw=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
 const key=await crypto.subtle.importKey('raw',await crypto.subtle.digest('SHA-256',enc.encode('pts:'+code)),'AES-GCM',false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},key,raw.slice(12));
 return JSON.parse(new TextDecoder().decode(pt));
}
/*ENDCRYPTO*/
const $=s=>document.querySelector(s);
const fmt=n=>(+n.toFixed(3)).toString().replace('.',',');
const cl=r=>r>=.9?'h4':r>=.75?'h3':r>=.55?'h2':r>=.3?'h1':'h0';
const E=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
function pinta(own){
 // own = {i:index d'alumne, pts:{k:punts}} o null
 const nm={};D.items.forEach(i=>nm[i.k]=i);if(!nm.ex)nm.ex={k:'ex',n:'Extres',max:null};
 $('#cards').innerHTML=D.alumnes.map((a,ix)=>{
  const me=own&&own.i===ix;
  const aps=Object.keys(a.cards).map(k=>{const it=nm[k]||{n:k,max:null},c=a.cards[k];
   let p='';
   if(me&&own.pts&&own.pts[k]!==undefined){const v=own.pts[k];p=it.max?`<span class="pts ${cl(v/it.max)}">${fmt(v)} / ${fmt(it.max)}</span>`:`<span class="pts h3">+${fmt(v)}</span>`}
   return `<div class="ap"><div class="hd"><h3>${E(it.n)}</h3>${p}</div><p style="margin:0">${E(c.c)}</p>${c.cap}</div>`}).join('');
  return `<details class="card${me?' me':''}" id="al-${a.l}"${me?' open':''}><summary>Alumne ${a.l}${me?' <span class="you">Tu</span>':''}</summary><div class="body">${aps}</div></details>`}).join('');
 if(own){const el=document.getElementById('al-'+D.alumnes[own.i].l);el.scrollIntoView({block:'start'})}
}
async function mira(){
 let own=null;const code=decodeURIComponent(location.hash.slice(1)).trim();
 if(code&&!['resum','errors','targetes','solucio'].includes(code)&&window.crypto&&crypto.subtle){
  try{const h=await sha(code);const i=D.alumnes.findIndex(a=>a.h===h);
   if(i>=0)own={i,pts:D.alumnes[i].e?await desxifra(code,D.alumnes[i].e):null}}catch(e){}}
 $('#estat').textContent=own?`Enllaç personal reconegut: la teva targeta és «Alumne ${D.alumnes[own.i].l}»${own.pts?', amb els teus punts per apartat':''}.`:'';
 pinta(own);
}
function inici(){
 document.title=D.titol;$('#kick').textContent=D.subtitol;$('#h1').textContent=D.titol;
 $('#kpis').innerHTML=`<div class="kpi"><b>${D.n}</b><span>lliuraments analitzats</span></div>`+(D.punts?`<div class="kpi"><b>${D.mitjana} %</b><span>de la nota possible, de mitjana</span></div>`:'')+(D.no_lliurats?`<div class="kpi"><b>${D.no_lliurats}</b><span>${D.no_lliurats===1?'alumne no ha lliurat':'alumnes no han lliurat'}</span></div>`:'');
 $('#intro').textContent='Feedback anònim: les targetes porten «Alumne A, B, C…» sense relació amb cap nom.'+(D.punts?' Si has entrat amb el teu enllaç personal, veuràs els teus punts per apartat a la teva targeta.':' Si has entrat amb el teu enllaç personal, la teva targeta s\'obre i es marca.');
 $('#introerr').textContent=D.intro_errors;$('#introtar').textContent=D.intro_targetes;
 if(!D.errs.length){$('#errors').classList.add('hide');$('#naverr').classList.add('hide')}
 if(!D.punts){document.querySelectorAll('#resum>.panel,#resum>.cols').forEach(x=>x.classList.add('hide'))}
 const nm={};D.items.forEach(i=>nm[i.k]=i);
 $('#bars').innerHTML=D.resum.map(r=>`<div class="bar"><span>${E(nm[r.k].n)}</span><div class="tr"><div class="fl" style="width:${r.pct}%"></div></div><em>${r.pct}%</em></div>`).join('');
 $('#forts').innerHTML=D.forts.map(x=>`<li>${E(x)}</li>`).join('')||'<li>—</li>';
 $('#millorar').innerHTML=D.millorar.map(x=>`<li>${E(x)}</li>`).join('')||'<li>—</li>';
 $('#errs').innerHTML=D.errs.map(e=>`<div class="panel"><div class="tagrow"><span class="pct">${e.f}/${D.n}</span><h3>${E(e.t)}</h3></div><p class="note">${e.p}</p><div class="ex"><div><span class="lab x">Així estava</span>${e.x}</div><div><span class="lab v">Així hauria de ser</span>${e.v}</div></div></div>`).join('');
 if(D.solucio){$('#solucio').classList.remove('hide');$('#navsol').classList.remove('hide');
  $('#solucio').innerHTML=`<h2>Solució oficial</h2><p class="sub"><a href="${E(D.solucio.url)}" target="_blank" rel="noopener">${E(D.solucio.nom)}</a></p>`+D.solucio.blocs.map(b=>`<div class="panel"><h3>${E(b.t)}</h3><pre>${E(b.f)}</pre></div>`).join('')}
 const T=['auto','clar','fosc'];let ti=0;
 $('#tema').onclick=()=>{ti=(ti+1)%3;const r=document.documentElement;ti?r.setAttribute('data-theme',ti==1?'light':'dark'):r.removeAttribute('data-theme');$('#tema').textContent='Tema: '+T[ti]};
 mira();addEventListener('hashchange',mira);
}
if(typeof document!=='undefined'&&document.getElementById('d')&&!window.__NOINIT)inici();
</script></body></html>
